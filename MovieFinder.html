<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineSphere 3D • 56 Blockbuster Movie Finder</title>
  <link rel="stylesheet" href="Mstyle.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <!-- Three.js for 3D Background Visuals -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <!-- 3D WebGL Background Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">🎬</span>
        <div>
          <h1 class="brand-title">CINESPHERE <span class="badge-3d">3D</span></h1>
          <p class="brand-subtitle">INTERN TASK 3 • 56 BLOCKBUSTERS</p>
        </div>
      </div>
      <div class="counter-badge" id="results-counter">
        Showing <span id="visible-count">56</span> of <span id="total-count">56</span> films
      </div>
    </header>

    <!-- Search Bar & Genre Filters -->
    <section class="controls-section">
      <div class="search-box">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search across 56 blockbuster films by title, director, cast, or plot keyword..." 
          autocomplete="off"
          spellcheck="false"
        >
        <button id="clear-search-btn" class="clear-btn" title="Clear search" aria-label="Clear search">&times;</button>
      </div>

      <!-- Genre Filter Pills -->
      <div class="genre-filters" id="genre-filters">
        <button class="filter-chip active" data-genre="all">All Genres</button>
        <button class="filter-chip" data-genre="Action">Action</button>
        <button class="filter-chip" data-genre="Sci-Fi">Sci-Fi</button>
        <button class="filter-chip" data-genre="Drama">Drama</button>
        <button class="filter-chip" data-genre="Animation">Animation</button>
        <button class="filter-chip" data-genre="Crime">Crime</button>
        <button class="filter-chip" data-genre="Comedy">Comedy</button>
        <button class="filter-chip" data-genre="Adventure">Adventure</button>
        <button class="filter-chip" data-genre="Horror">Horror</button>
        <button class="filter-chip" data-genre="Cyberpunk">Cyberpunk</button>
      </div>
    </section>

    <!-- Movie Cards Grid -->
    <main class="movies-grid" id="movies-grid"></main>

    <!-- Empty State -->
    <div class="empty-state hidden" id="empty-state">
      <div class="empty-icon">🔍</div>
      <h3 class="empty-title">No movies found</h3>
      <p class="empty-text">We couldn't find anything matching your search. Try adjusting keywords or resetting filters.</p>
      <button class="reset-search-btn" id="reset-search-btn">Reset All Filters</button>
    </div>

    <!-- Movie Details Modal -->
    <div class="modal-overlay hidden" id="movie-modal">
      <div class="modal-card">
        <button class="modal-close-btn" id="modal-close-btn">&times;</button>
        <div class="modal-content" id="modal-content"></div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
      <span>Interactive 3D Movie Finder • 56 High-Definition Official Posters • Three.js Ambient Scene</span>
    </footer>
  </div>

  <script src="Mscript.js"></script>
</body>
</html>
